# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render detects this file in the repo root and offers a one-click deploy.
# JWT_SECRET is deliberately left empty (sync: false) so Render prompts for
# it during setup — the server refuses to start in production without one.

services:
  - type: web
    name: redhan-news
    runtime: node
    plan: free
    region: singapore          # closest region to the Maldives
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false            # Render will ask you to supply this
      # Wiring a Postgres instance is what makes content survive a restart.
      # The app falls back to a JSON file when this is absent (local dev, CI).
      - key: DATABASE_URL
        fromDatabase:
          name: redhan-db
          property: connectionString

databases:
  - name: redhan-db
    plan: free
