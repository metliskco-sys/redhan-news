<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password — Redhan</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth__aside { display: none; }
        .editorial-note {
            border: 1px solid var(--line-mid);
            border-left: 2px solid var(--sky-400);
            background: var(--sky-glow);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-dim);
        }
        .strength {
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .strength > span {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
        }
        .strength.is-weak > span { width: 33%; background: var(--err); }
        .strength.is-fair > span { width: 66%; background: var(--warn); }
        .strength.is-good > span { width: 100%; background: var(--ok); }
    </style>
</head>
<body>
    <div class="ambient" aria-hidden="true">
        <span class="orb orb--1" data-depth="22"></span>
        <span class="orb orb--2" data-depth="40"></span>
    </div>
    <main class="auth">
        <div class="auth__card">
            <span class="kicker">Password reset</span>
            <h1 class="auth__title">Choose a new password</h1>
            <p class="auth__sub">At least 8 characters, with a letter and a number. You will be signed out everywhere else.</p>

            <form class="auth__form" id="resetForm" novalidate>
                <div class="field">
                    <label for="password">New password</label>
                    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                    <div class="strength" id="strength"><span></span></div>
                </div>
                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn--solid btn--block" id="resetBtn">Set new password</button>
            </form>

            <p class="auth__foot">
                <span>Link expired? <a href="/forgot-password">Request a new one</a></span>
                <a href="/login">← Back to sign in</a>
            </p>
        </div>
    </main>

    <script src="/js/ambient.js"></script>
    <script src="/js/api.js"></script>
    <script>
        var token = new URLSearchParams(location.search).get('token');

        var pw = document.getElementById('password');
        var strength = document.getElementById('strength');
        pw.addEventListener('input', function () {
            var v = pw.value;
            var score = 0;
            if (v.length >= 8) score++;
            if (/[0-9]/.test(v)) score++;
            if (/[a-zA-Z]/.test(v)) score++;
            strength.className = 'strength' +
                (score <= 1 ? ' is-weak' : score === 2 ? ' is-fair' : ' is-good');
        });

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('resetBtn');

            if (!token) {
                alert('This reset link is missing its token. Request a new one.');
                return;
            }
            if (pw.value !== document.getElementById('confirm').value) {
                alert('The passwords do not match.');
                return;
            }
            if (pw.value.length < 8 || !/[0-9]/.test(pw.value) || !/[a-zA-Z]/.test(pw.value)) {
                alert('Use at least 8 characters including a letter and a number.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Saving…';
            try {
                await api.resetPassword(token, pw.value);
                document.getElementById('resetForm').innerHTML =
                    '<div class="editorial-note">Password updated. You can now sign in with your new password.</div>';
                setTimeout(function () { location.href = '/login'; }, 1600);
            } catch (err) {
                alert(err.message || 'Could not reset the password.');
                btn.disabled = false;
                btn.textContent = 'Set new password';
            }
        });
    </script>
</body>
</html>
