<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot your password — Redhan</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth__aside { display: none; }
    </style>
</head>
<body>
    <div class="ambient" aria-hidden="true">
        <span class="orb orb--1" data-depth="22"></span>
        <span class="orb orb--2" data-depth="40"></span>
    </div>
    <main class="auth">
        <div class="auth__card">
            <span class="kicker">Password help</span>
            <h1 class="auth__title">Forgot your password?</h1>
            <p class="auth__sub">
                Enter the email on your account and we will send a link to choose a new one. The link expires in one hour.
            </p>

            <form class="auth__form" id="forgotForm" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@redhan.mv">
                </div>
                <button type="submit" class="btn btn--solid btn--block" id="forgotBtn">Send reset link</button>
            </form>

            <p class="auth__foot">
                <span>Remembered it? <a href="/login">Back to sign in</a></span>
                <a href="/">← Home</a>
            </p>
        </div>
    </main>

    <script src="/js/ambient.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const email = document.getElementById('email').value.trim();
            if (!email) { alert('Enter your email address.'); return; }

            btn.disabled = true;
            btn.textContent = 'Sending…';
            try {
                await api.forgotPassword(email);
                // The response is intentionally the same whether or not the
                // account exists, so say exactly that.
                document.getElementById('forgotForm').innerHTML =
                    '<div class="editorial-note">If an account exists for <b></b>, a reset link is on its way. ' +
                    'Check your spam folder too — the link expires in one hour.</div>'
                    .replace('<b></b>', '<b>' + email.replace(/</g, '&lt;') + '</b>');
            } catch (err) {
                alert(err.message || 'Something went wrong. Try again.');
                btn.disabled = false;
                btn.textContent = 'Send reset link';
            }
        });
    </script>
</body>
</html>
